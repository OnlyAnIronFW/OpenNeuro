# ═══════════════════════════════════════════
# AI 主播配置 v2.0
# ═══════════════════════════════════════════

models:
  s1:
    model_id: "openbmb/MiniCPM-o-4_5"
    quantization: "int4"
    device: "cuda:0"
    inference:
      max_tokens: 128
      temperature: 0.1
      decision_interval_ms: 1000
  s2:
    primary:
      provider: "deepseek"
      model: "deepseek-v4-flash"
      api_key: "${DEEPSEEK_API_KEY}"
      api_base: "https://api.deepseek.com/v1"
      temperature: 1.0
      top_p: 1.0
    timeout_ms: 5000

s1_decision:
  protection_period_ms: 2000
  max_replies_per_10s: 3
  silence_watchdog_ms: 60000
  forced_cooldown_ms: 5000
  speak_priority_threshold: 0.5
  quick_reply_max_chars: 15

threads:
  max_active: 10
  merge_similarity_threshold: 0.7
  cooldown_after_replies: 3
  cooldown_duration_ms: 10000
  stale_timeout_ms: 300000
  close_timeout_ms: 900000

visual:
  capture_fps: 2
  resolution: 512
  change_detection_threshold: 0.05
  heartbeat_timeout_ms: 5000

memory:
  l1:
    recent_messages_count: 50
    recent_decisions_count: 10
  l2:
    backend: "chromadb"
    retention_days: 30
    semantic_cache:
      enabled: true
      similarity_threshold: 0.88
      ttl_hours: 24
  l3:
    backend: "pgvector"
    viewer_min_interactions: 3

self_iteration:
  phase2_3:
    trigger: "stream_end"
    max_samples: 500
  phase4:
    trigger: "weekly"
    require_human_approval: true
    require_replay_validation: true
    replay_streams: 3
    min_score_improvement: 0.05

degradation:
  s2_timeout_threshold_ms: 3000
  s2_error_rate_threshold: 0.3
  auto_recovery_check_ms: 30000
  recovery_min_success_streak: 10

platforms:
  bilibili:
    enabled: true
    output_filter: "strict"
  twitch:
    enabled: false
    output_filter: "lenient"
  discord:
    enabled: false
    output_filter: "lenient"

observability:
  metrics_export_interval_ms: 10000
  p0_notify_webhook: ""
  p1_notify_webhook: ""
  log_level: "info"
  decision_trace: true

session:
  auto_save_recording: true
  recording_path: "data/recordings"
  generate_post_stream_report: true
